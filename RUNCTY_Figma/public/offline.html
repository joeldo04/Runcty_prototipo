<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Sin conexión · RUNCTY</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0b1020;
        color: #f8fafc;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      img { width: 88px; height: 88px; border-radius: 50%; }
      h1 { margin: 20px 0 8px; font-size: 22px; }
      p { max-width: 300px; margin: 0 auto 24px; color: #cbd5e1; font-size: 15px; line-height: 1.5; }
      button {
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: #2f6fe8;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="RUNCTY" />
      <h1>Sin conexión</h1>
      <p>RUNCTY necesita internet para mostrar rutas y condiciones actualizadas.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
